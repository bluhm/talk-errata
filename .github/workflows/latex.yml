name: LaTeX CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get remove firefox google-chrome-stable
        sudo apt-get autoremove
        sudo apt-get -y upgrade
        sudo apt-get -y install texlive-latex-recommended texlive-pictures lmodern
    - name: Checkout sources
      uses: actions/checkout@v4
    - name: Make build
      run: make
    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: errata-slides
        path: errata-slides.pdf
